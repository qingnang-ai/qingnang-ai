<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青囊AI · 登录</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

  <div class="auth-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 100 100" width="56" height="56">
          <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <text x="50" y="64" text-anchor="middle" font-size="36" fill="#e8c878" font-family="Noto Serif SC, serif" font-weight="700">青</text>
        </svg>
      </div>
      <h1 class="auth-title">青囊AI</h1>
      <p class="auth-subtitle">智慧中医 · 对话健康</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">登录</button>
      <button class="auth-tab" data-tab="register">注册</button>
    </div>

    <!-- 登录表单 -->
    <form id="loginForm" class="auth-form active">
      <div class="input-group">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input type="text" id="loginUser" placeholder="用户名" autocomplete="username">
      </div>
      <div class="input-group">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="loginPass" placeholder="密码" autocomplete="current-password">
      </div>
      <button type="submit" class="auth-btn">登 录</button>
    </form>

    <!-- 注册表单 -->
    <form id="registerForm" class="auth-form">
      <div class="input-group">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input type="text" id="regUser" placeholder="设置用户名（至少2个字符）">
      </div>
      <div class="input-group">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="regPass" placeholder="设置密码（至少4个字符）">
      </div>
      <button type="submit" class="auth-btn">注 册</button>
    </form>

    <div id="authMsg" class="auth-msg"></div>
  </div>

  <script>
    const tabs = document.querySelectorAll('.auth-tab');
    const forms = document.querySelectorAll('.auth-form');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const target = tab.dataset.tab;
        tabs.forEach(t => t.classList.remove('active'));
        forms.forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(target + 'Form').classList.add('active');
        document.getElementById('authMsg').textContent = '';
      });
    });

    function showMsg(msg, isError) {
      const el = document.getElementById('authMsg');
      el.textContent = msg;
      el.className = 'auth-msg' + (isError ? ' error' : ' success');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      if (!username || !password) { showMsg('请填写用户名和密码', true); return; }
      try {
        const resp = await fetch('/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password})
        });
        const data = await resp.json();
        if (data.ok) { window.location.href = '/chat'; }
        else { showMsg(data.msg, true); }
      } catch (err) { showMsg('网络错误，请重试', true); }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value;
      if (!username || !password) { showMsg('请填写用户名和密码', true); return; }
      try {
        const resp = await fetch('/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password})
        });
        const data = await resp.json();
        if (data.ok) { window.location.href = '/chat'; }
        else { showMsg(data.msg, true); }
      } catch (err) { showMsg('网络错误，请重试', true); }
    });
  </script>
</body>
</html>
