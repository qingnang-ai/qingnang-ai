<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青囊AI · 对话</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="chat-body">

  <!-- 顶栏 -->
  <header class="chat-header">
    <div class="header-left">
      <div class="logo-mini">
        <svg viewBox="0 0 100 100" width="32" height="32">
          <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
          <text x="50" y="66" text-anchor="middle" font-size="38" fill="#e8c878" font-family="Noto Serif SC, serif" font-weight="700">青</text>
        </svg>
      </div>
      <span class="header-title">青囊AI</span>
    </div>
    <div class="header-right">
      <button class="header-btn" id="settingsBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>设置</span>
      </button>
      <button class="header-btn" id="logoutBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>退出</span>
      </button>
    </div>
  </header>

  <!-- 聊天区域 -->
  <main class="chat-main">
    <div class="chat-messages" id="chatMessages">
      <div class="welcome-msg">
        <div class="welcome-icon">
          <svg viewBox="0 0 100 100" width="60" height="60">
            <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(184,168,92,0.3)" stroke-width="2"/>
            <text x="50" y="66" text-anchor="middle" font-size="38" fill="#b8a85c" font-family="Noto Serif SC, serif" font-weight="700">青</text>
          </svg>
        </div>
        <h2>欢迎使用青囊AI</h2>
        <p>我是你的智能助手，可以回答健康科普、日常问答等各类问题。</p>
        <p class="welcome-tip">请在右上方「设置」中填写豆包 API Key 和模型 ID 后开始对话。</p>
        <div class="suggestions">
          <button class="suggestion-btn" data-prompt="你好，请介绍一下你自己">你好，请介绍一下你自己</button>
          <button class="suggestion-btn" data-prompt="什么是中医九种体质？">什么是中医九种体质？</button>
          <button class="suggestion-btn" data-prompt="日常养生有什么建议？">日常养生有什么建议？</button>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="chat-input-area">
      <div class="chat-input-wrap">
        <textarea id="chatInput" placeholder="输入消息，按 Enter 发送..." rows="1"></textarea>
        <button id="sendBtn" class="send-btn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="chat-disclaimer">青囊AI 仅供参考，不构成医疗诊断，身体不适请及时就医</div>
    </div>
  </main>

  <!-- 设置弹窗 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>豆包 API 设置</h3>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <label>API Key</label>
          <input type="password" id="apiKeyInput" placeholder="填写豆包 API Key">
          <p class="setting-hint">在火山引擎控制台 → 在线推理 → API Key 获取</p>
        </div>
        <div class="setting-item">
          <label>模型 ID</label>
          <input type="text" id="modelIdInput" placeholder="如 doubao-pro-32k 或 ep-xxxx">
          <p class="setting-hint">在火山引擎控制台 → 在线推理 → 模型 ID</p>
        </div>
        <div class="setting-links">
          <a href="https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey" target="_blank" class="setting-link">获取 API Key →</a>
          <a href="https://console.volcengine.com/ark/region:ark+cn-beijing/openManagement" target="_blank" class="setting-link">获取模型 ID →</a>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn save" id="saveSettings">保存设置</button>
      </div>
    </div>
  </div>

  <script>
    const username = '{{ username }}';
    let messages = [];
    let isWaiting = false;

    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const settingsModal = document.getElementById('settingsModal');

    // 自动调整输入框高度
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
      sendBtn.disabled = !chatInput.value.trim() || isWaiting;
    });

    // Enter 发送
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    // 建议问题
    document.querySelectorAll('.suggestion-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        chatInput.value = btn.dataset.prompt;
        chatInput.dispatchEvent(new Event('input'));
        sendMessage();
      });
    });

    function addMessage(role, content) {
      // 移除欢迎消息
      const welcome = chatMessages.querySelector('.welcome-msg');
      if (welcome) welcome.remove();

      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ' + (role === 'user' ? 'user-msg' : 'ai-msg');

      if (role === 'user') {
        msgDiv.innerHTML = `<div class="msg-bubble">${escapeHtml(content)}</div><div class="msg-avatar user-avatar">${username.charAt(0).toUpperCase()}</div>`;
      } else {
        msgDiv.innerHTML = `<div class="msg-avatar ai-avatar"><span>青</span></div><div class="msg-bubble">${formatContent(content)}</div>`;
      }
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addTypingIndicator() {
      const welcome = chatMessages.querySelector('.welcome-msg');
      if (welcome) welcome.remove();
      const div = document.createElement('div');
      div.className = 'message ai-msg';
      div.id = 'typingIndicator';
      div.innerHTML = `<div class="msg-avatar ai-avatar"><span>青</span></div><div class="msg-bubble typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    async function sendMessage() {
      const content = chatInput.value.trim();
      if (!content || isWaiting) return;

      isWaiting = true;
      sendBtn.disabled = true;
      chatInput.value = '';
      chatInput.style.height = 'auto';

      addMessage('user', content);
      messages.push({role: 'user', content: content});

      addTypingIndicator();

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({messages: messages})
        });
        const data = await resp.json();
        removeTypingIndicator();
        if (data.ok) {
          addMessage('assistant', data.reply);
          messages.push({role: 'assistant', content: data.reply});
        } else {
          addMessage('assistant', '⚠️ ' + data.msg);
        }
      } catch (err) {
        removeTypingIndicator();
        addMessage('assistant', '⚠️ 网络错误，请重试');
      }
      isWaiting = false;
      sendBtn.disabled = !chatInput.value.trim();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatContent(str) {
      return escapeHtml(str).replace(/\n/g, '<br>');
    }

    // 设置弹窗
    document.getElementById('settingsBtn').addEventListener('click', async () => {
      settingsModal.classList.add('show');
      try {
        const resp = await fetch('/api/settings');
        const data = await resp.json();
        document.getElementById('apiKeyInput').value = data.api_key || '';
        document.getElementById('modelIdInput').value = data.model_id || '';
      } catch (err) {}
    });

    document.getElementById('closeModal').addEventListener('click', () => {
      settingsModal.classList.remove('show');
    });

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) settingsModal.classList.remove('show');
    });

    document.getElementById('saveSettings').addEventListener('click', async () => {
      const api_key = document.getElementById('apiKeyInput').value.trim();
      const model_id = document.getElementById('modelIdInput').value.trim();
      if (!api_key || !model_id) { alert('请填写 API Key 和模型 ID'); return; }
      try {
        const resp = await fetch('/api/settings', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({api_key, model_id})
        });
        const data = await resp.json();
        if (data.ok) {
          settingsModal.classList.remove('show');
          const tip = document.querySelector('.welcome-tip');
          if (tip) tip.textContent = '设置已保存，现在可以开始对话了！';
        }
      } catch (err) { alert('保存失败，请重试'); }
    });

    // 退出登录
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('确定退出登录吗？')) window.location.href = '/logout';
    });
  </script>
</body>
</html>
